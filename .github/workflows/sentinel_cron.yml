# ==============================================================================
# PROYECTO: Oraculum Pulse Sentinel (Fase 4: Automatización 100% Gratuita 24/7)
# ARCHIVO: .github/workflows/sentinel_cron.yml
# OBJETIVO: Ordenar a los servidores gratuitos de GitHub que despierten cada
#           5 minutos, ejecuten nuestro bot de Python y manden alertas a Telegram.
# ==============================================================================

name: Oraculum Pulse Smart Money Radar

on:
  # 1. 'schedule' permite ejecutar el bot automáticamente con un reloj (Cron Job)
  schedule:
    - cron: '*/5 * * * *'  # Se ejecuta automáticamente cada 5 minutos, 24/7
  
  # 2. 'workflow_dispatch' añade un botón en GitHub para probarlo manualmente cuando quieras
  workflow_dispatch:

jobs:
  escanear-ballenas:
    runs-on: ubuntu-latest  # Usamos una máquina virtual Linux gratuita de GitHub

    steps:
      # Paso 1: Descargar el código de tu repositorio en la máquina de GitHub
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      # Paso 2: Instalar Python 3.11 en segundos
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Paso 3: Instalar la librería 'requests' para conectarnos a Polymarket y Telegram
      - name: Instalar librerías necesarias
        run: pip install requests

      # Paso 4: Ejecutar el bot inyectando tus 3 llaves secretas de forma 100% segura
      - name: Ejecutar Oraculum Pulse Sentinel
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python sentinel_bot.py
