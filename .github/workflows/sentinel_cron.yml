# ==============================================================================
# PROYECTO: VerdictFlow Sentinel v2.0 PRO (Con Memoria Anti-Duplicados Gratis)
# ARCHIVO: .github/workflows/sentinel_cron.yml
# ==============================================================================

name: VerdictFlow Smart Money Radar

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Permiso gratuito para que el bot guarde su archivo de memoria (memoria_ballenas.json)
permissions:
  contents: write

jobs:
  escanear-ballenas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código y memoria del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías necesarias
        run: pip install requests

      - name: Ejecutar VerdictFlow Sentinel v2.0 PRO
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python sentinel_bot.py

      - name: Guardar memoria de alertas enviadas (Anti-Duplicados)
        run: |
          if [ -f memoria_ballenas.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add memoria_ballenas.json
            git diff --staged --quiet || git commit -m "chore: actualizar memoria anti-duplicados"
            git push
          fi
